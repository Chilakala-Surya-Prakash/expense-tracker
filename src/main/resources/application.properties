spring.application.name=expense-tracker
server.port =  8080
# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:expensedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration (256-bit base64 secret key & 24h expiration)
app.jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
app.jwt.expiration-ms=86400000

# Gemini AI Configuration (Optional key; uses smart fallback if empty)
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=gemini-2.5-flash
spring.ai.google.api-key=${GEMINI_API_KEY:dummy-key}